<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evidence | ERTY Official</title>
    <meta
      name="description"
      content="ERTY 제품 설명에 사용되는 근거를 유형별로 축적하는 evidence 페이지입니다."
    />
    <link rel="stylesheet" href="/assets/css/reset.css" />
    <link rel="stylesheet" href="/assets/css/global.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
  </head>
  <body data-page="evidence">
    <div data-component="header"></div>

    <main class="page-main">
      <section class="page-hero">
        <div class="container page-hero__grid">
          <div class="page-hero__content reading-column">
            <div>
              <p class="eyebrow">Evidence</p>
              <h1>근거를 축적하는 독립 레이어</h1>
            </div>
            <p class="lead">
              제품 상세의 proof를 한곳에 모아, 수치형·후기형·기전형 근거를
              서로 다른 강도로 관리하는 구조입니다.
            </p>
          </div>
          <aside class="page-hero__aside">
            <article class="surface-note">
              <p class="eyebrow">Proof Classes</p>
              <p>근거는 class A, B, C로 나눠 제품 상세와 분리해 축적합니다.</p>
            </article>
          </aside>
        </div>
      </section>

      <section class="section section--tight">
        <div class="container info-grid">
          <article class="info-card">
            <p class="info-card__value">Class A</p>
            <h3>수치형 근거</h3>
            <p>측정값과 조건이 분명한 근거를 우선 관리합니다.</p>
          </article>
          <article class="info-card">
            <p class="info-card__value">Class B</p>
            <h3>후기·그래프형 근거</h3>
            <p>후기와 전후 변화, 보조 그래프를 정리합니다.</p>
          </article>
          <article class="info-card">
            <p class="info-card__value">Class C</p>
            <h3>기전형 근거</h3>
            <p>메커니즘과 성분 설명 중심의 신뢰 레이어를 보완합니다.</p>
          </article>
        </div>
      </section>
    </main>

    <div data-component="footer"></div>

    <script src="/assets/js/components.js" defer></script>
    <script src="/assets/js/main.js" defer></script>
  </body>
</html>
