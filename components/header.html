<header class="site-header" data-header>
  <div class="container site-header__inner">
    <a class="site-brand" href="/" aria-label="ERTY Home">
      <img
        class="site-brand__logo"
        src="/assets/images/brand/erty-logo-black.png"
        alt="ERTY"
        width="401"
        height="209"
        decoding="async"
      />
    </a>

    <button
      class="site-header__toggle"
      type="button"
      aria-expanded="false"
      aria-controls="site-nav"
      data-nav-toggle
    >
      <span data-nav-toggle-label lang="en">Menu</span>
    </button>

    <div class="site-header__panel" data-nav-panel>
      <nav class="global-nav site-nav" id="site-nav" aria-label="Global" lang="en">
        <a href="/" class="global-nav__link" data-nav-link>Home</a>
        <a href="/by-concern/" class="global-nav__link" data-nav-link>By Concern</a>
        <a href="/products/" class="global-nav__link" data-nav-link>Products</a>
        <a href="/insight/" class="global-nav__link" data-nav-link>Insight</a>
        <a href="/archive/" class="global-nav__link" data-nav-link>Archive</a>
        <a href="/brand/" class="global-nav__link" data-nav-link>Brand</a>
      </nav>

      <div class="site-header__meta">
        <span class="status-chip status-chip--neutral site-locale" lang="ko">
          <img
            class="site-locale__flag"
            src="/assets/images/brand/korea-flag-round.png"
            alt=""
            width="48"
            height="48"
            decoding="async"
            aria-hidden="true"
          />
          <span>한국어</span>
        </span>
      </div>
    </div>
  </div>
</header>
