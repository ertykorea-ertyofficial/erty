<header class="site-header" data-header>
  <div class="container site-header__inner">
    <a class="site-brand" href="/" aria-label="ERTY Home">
      <img
        class="site-brand__logo"
        src="/assets/images/brand/erty-logo-no-slogan-black.png"
        alt="ERTY"
        width="120"
        height="28"
      />
      <span class="site-brand__meta">Official Brand Index</span>
    </a>

    <button
      class="site-header__toggle"
      type="button"
      aria-expanded="false"
      aria-controls="site-nav"
      data-nav-toggle
    >
      <span data-nav-toggle-label>Menu</span>
    </button>

    <div class="site-header__panel" data-nav-panel>
      <nav class="global-nav site-nav" id="site-nav" aria-label="Global">
        <a href="/" class="global-nav__link" data-nav-link>Home</a>
        <a href="/by-concern/" class="global-nav__link" data-nav-link>By Concern</a>
        <a href="/products/" class="global-nav__link" data-nav-link>Products</a>
        <a href="/guide/" class="global-nav__link" data-nav-link>Guide</a>
        <a href="/results/" class="global-nav__link" data-nav-link>Results</a>
        <a href="/brand/" class="global-nav__link" data-nav-link>Brand</a>
      </nav>

      <div class="site-header__meta">
        <span class="status-chip status-chip--neutral">ko-KR</span>
      </div>
    </div>
  </div>
</header>
